<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kongens gate 10b</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background-image: url("bak.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 800px;
    width: 100%;
    text-align: center;

    /* Gjør innholdet lettere å lese over bildet */
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    padding: 35px;
    border-radius: 20px;
}

.language-switch {
    margin-bottom: 20px;
}

.language-switch button {
    background: #334733;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
}

.language-switch button:hover {
    transform: translateY(-2px);
    opacity: .9;
}

.language-switch button.active {
    background: #628562;
    color: #fcfcfc;
}

audio {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 10px auto 20px;
}

h1 {
    margin-bottom: 0;
}
</style>
</head>

<body>

<div class="container">

    <div class="language-switch">
        <button id="enBtn" class="active" onclick="setLanguage('en')">
            English
        </button>

        <button id="noBtn" onclick="setLanguage('no')">
            Norsk
        </button>
    </div>

    <audio id="audio" controls preload="none"></audio>

    <h1 id="title">
        Architectural Highlights<br>
        Kongens gate 10b
    </h1>

</div>

<script>
const audio = document.getElementById("audio");

const content = {
    en: {
        title: "Architectural Highlights<br>Kongens gate 10b",
        audio: "stop6.mp3"
    },
    no: {
        title: "Arkitektoniske høydepunkter<br>Kongens gate 10b",
        audio: "stop6norsk.mp3"
    }
};

function setLanguage(lang) {
    document.getElementById("title").innerHTML = content[lang].title;

    document.getElementById("enBtn")
        .classList.toggle("active", lang === "en");

    document.getElementById("noBtn")
        .classList.toggle("active", lang === "no");

    audio.pause();
    audio.currentTime = 0;
    audio.src = content[lang].audio;
    audio.load();
}

window.onload = () => setLanguage("en");
</script>

</body>
</html>
