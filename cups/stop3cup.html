<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parkgata 5</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f9f9f9;font-family:Arial,sans-serif;padding:20px}
/* Background image */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("bak.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:-2;
}

/* Light overlay so the foreground content stays readable */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.05);
    z-index:-1;
}
  
.container{max-width:800px;width:100%;text-align:center}
img{max-width:100%;max-height:45svh;width:auto;height:auto;object-fit:contain;border-radius:12px;margin-bottom:20px}
.language-switch{margin-bottom:20px}
.language-switch button{background:#4f3b20;color:#fff;border:none;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;transition:.25s}
.language-switch button:hover{transform:translateY(-2px);opacity:.9}
.language-switch button.active{background:#b89f7f;color:#fcfcfc}
audio{display:block;width:100%;max-width:500px;margin:10px auto 20px}
</style>
</head>
<body>
<div class="container">
<img src="stop3.png" alt="Parkgata 5">
<div class="language-switch">
<button id="enBtn" class="active" onclick="setLanguage('en')">English</button>
<button id="noBtn" onclick="setLanguage('no')">Norsk</button>
</div>
<audio id="audio" controls preload="none"></audio>
<h1 id="title">Architectural Highlights<br>Parkgata 5</h1>
</div>
<script>
const audio=document.getElementById("audio");
const content={
en:{title:"Architectural Highlights<br>Parkgata 5",audio:"stop3.mp3"},
no:{title:"Arkitektoniske høydepunkter<br>Parkgata 5",audio:"stop3norsk.mp3"}
};
function setLanguage(lang){
document.getElementById("title").innerHTML=content[lang].title;
document.getElementById("enBtn").classList.toggle("active",lang==="en");
document.getElementById("noBtn").classList.toggle("active",lang==="no");
audio.pause();
audio.currentTime=0;
audio.src=content[lang].audio;
audio.load();
}
window.onload=()=>setLanguage("en");
</script>
</body>
</html>
