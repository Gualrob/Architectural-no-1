<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einarvikgata 7</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f9f9f9;font-family:Arial,sans-serif;padding:20px}
.container{max-width:800px;width:100%;text-align:center}
img{max-width:100%;max-height:45svh;width:auto;height:auto;object-fit:contain;border-radius:12px;margin-bottom:20px}
.language-switch{margin-bottom:20px}
.language-switch button{background:#575135;color:#fff;border:none;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;transition:.25s}
.language-switch button:hover{transform:translateY(-2px);opacity:.9}
.language-switch button.active{background:#aba587;color:#264653}
audio{display:block;width:100%;max-width:500px;margin:10px auto 20px}
</style>
</head>
<body>
<div class="container">
<img src="stop2.png" alt="Einarvikgata 7">
<div class="language-switch">
<button id="enBtn" class="active" onclick="setLanguage('en')">English</button>
<button id="noBtn" onclick="setLanguage('no')">Norsk</button>
</div>
<audio id="audio" controls preload="none"></audio>
<h1 id="title">Architectural Highlights<br>Einarvikgata 7</h1>
</div>
<script>
const audio=document.getElementById("audio");
const content={
en:{title:"Architectural Highlights<br>Einarvikgata 7",audio:"stop2.mp3"},
no:{title:"Arkitektoniske høydepunkter<br>Einarvikgata 7",audio:"stop2norsk.mp3"}
};
function setLanguage(lang){
document.getElementById("title").innerHTML=content[lang].title;
document.getElementById("enBtn").classList.toggle("active",lang==="en");
document.getElementById("noBtn").classList.toggle("active",lang==="no");
audio.pause();
audio.currentTime=0;
audio.src=content[lang].audio;
audio.load();
}
window.onload=()=>setLanguage("en");
</script>
</body>
</html>
